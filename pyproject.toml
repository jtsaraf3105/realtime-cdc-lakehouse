[project]
name = "realtime-cdc-lakehouse"
version = "1.0.0"
description = "Postgres -> Debezium -> Kafka -> Spark Structured Streaming -> Delta Lake, with dbt, Great Expectations and Airflow."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/target", "dbt/dbt_packages", ".airflow"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["lakehouse", "tests"]

[tool.ruff.lint.per-file-ignores]
"lakehouse/quality/checks.py" = ["E501"]
"scripts/benchmark.py" = ["E501"]
"tests/**" = ["E501"]
