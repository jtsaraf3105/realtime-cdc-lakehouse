version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [not_null]
      - name: tier
        data_tests:
          - accepted_values:
              arguments: {values: ["standard", "silver", "gold"]}
  - name: stg_customer_history
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: sku
        data_tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: ["created", "paid", "shipped", "delivered", "cancelled"]}
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: quantity
        data_tests: [not_null]
